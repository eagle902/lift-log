  if(t.id==='restoreFile' && t.files && t.files[0]){
    t.files[0].text().then(txt=>{ restoreDraft=txt.trim(); confirmOpen.restore=true; render();
      const ta=document.getElementById('restoreText'); if(ta) ta.value=restoreDraft.slice(0,300)+(restoreDraft.length>300?'…':''); });
    return;
  }
  if(t.dataset.edit){
    const sec=t.closest('.ex'), ex=sec&&(program[tab]||[]).find(x=>x.id===sec.dataset.ex); if(!ex) return;
    const k=t.dataset.edit, v=t.value===''?null:Math.round(Number(t.value));
    if(k==='repsMax'){ if(v && v>ex.reps) ex.repsMax=v; else delete ex.repsMax; }
    else if(v && v>0){ ex[k]=Math.min(k==='rest'?600:k==='sets'?10:300, v); if(k==='reps' && ex.repsMax && ex.repsMax<=v) delete ex.repsMax; }
    saveProgram(); render(); return;
  }
  if(t.dataset.t){ testInput(t); return; }
  if(t.dataset.prof){ const v=Number(t.value); if(v>=20&&v<=100){ profile.age=Math.round(v); LS.set('ppl-profile',profile); render(); } return; }
});
main.addEventListener('input',e=>{
  if(e.target.id==='foodText'){ setFood(curFoodDate(), e.target.value); return; }
  if(!DAY_TABS.includes(tab)) return;
  const d=getDraft(tab), t=e.target;
  if(t.dataset.edit) return;
  if(t.type==='date'){d.date=t.value||todayISO();putDraft(d);return}
  if(t.dataset.x){d[t.dataset.x]=t.value;putDraft(d);return}
  if(t.dataset.cf){const ci=+t.closest('.cardio').dataset.ci; d.cardio[ci][t.dataset.cf]=t.value===''?null:(t.type==='number'?Number(t.value):t.value); putDraft(d); return}
  const sec=t.closest('.ex'), row=t.closest('.set');
  if(sec&&row&&t.dataset.f){
    const id=sec.dataset.ex,i=+row.dataset.i;
    d.entries[id]=d.entries[id]||{sets:[]};
    const s=d.entries[id].sets[i]=d.entries[id].sets[i]||{};
    s[t.dataset.f]= t.value===''?null:Number(t.value);
    putDraft(d);
  }
});

main.addEventListener('submit',e=>{
  e.preventDefault();
  const name=document.getElementById('add-name').value.trim(); if(!name) return;
  const ex={id:'c-'+newId(),name,sets:+document.getElementById('add-sets').value||3,reps:+document.getElementById('add-reps').value||12,
    rest:+document.getElementById('add-rest').value||45,hint:Number(document.getElementById('add-hint').value)||0,step:2.5};
  const rm=+document.getElementById('add-repsmax').value; if(rm>ex.reps) ex.repsMax=rm;
  program[tab].push(ex); addOpen=false; saveProgram(); render();
});

main.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, sec=b.closest('.ex'), exId=sec&&sec.dataset.ex;
  const ex=exId&&(program[tab]||[]).find(x=>x.id===exId);
  if(commonAction(act,b)) return;
  if(act==='day' || act==='pview'){ goTab(b.dataset.v); return; }
  if(photoAction(act,b)) return;
  if(tab==='test'){ testAction(act,b); return; }
  if(tab==='food'){ foodAction(act,b); return; }
  if(tab==='report' || tab==='more'){
    const item=b.closest('.h-item'), sid=item&&item.dataset.sid;
    if(act==='mode'){reportMode=b.dataset.v;render();}
    else if(act==='copy'){copyText(buildReport(reportMode),document.getElementById('reportText'));}
    else if(act==='share'){shareText(buildReport(reportMode),document.getElementById('reportText'),true);}
    else if(act==='plan-check'){
      const v=(document.getElementById('planText').value||'').trim();
      if(!v){toast('Paste the plan update into the box first');return}
      loadPlanText(v);
    }
    else if(act==='plan-paste'){ pastePlan(); }
    else if(act==='share-week'){ shareText(buildReport('week'),null,true); }
    else if(act==='plan-cancel'){planPending=null;planPreview=null;render();}
    else if(act==='plan-apply'){
      const o=planPending, now=new Date().toISOString();
      const np={push:o.program.push,pull:o.program.pull,legs:o.program.legs,cardio:Array.isArray(o.program.cardio)?o.program.cardio:[],notes:o.notes||{},label:o.label||'',days:o.days||null,appliedAt:new Date().toISOString()};
      ['push','pull','legs','cardio'].forEach(d=>np[d].forEach(x=>{ if(x.coach) x.coach.setAt=now; }));
      program=np; applyDays(); saveProgram(); planPending=null; planPreview=null; render(); toast('Plan '+(np.label||'')+' applied');
    }
    else if(act==='sdel'){confirmOpen['s:'+sid]=true;render();}
    else if(act==='sdel-no'){delete confirmOpen['s:'+sid];render();}
    else if(act==='sdel-yes'){delete confirmOpen['s:'+sid];deleteSession(sid);}
    else if(act==='backup'){copyText(backupJSON(),null,'Backup copied — paste it somewhere safe'); LS.set('ppl-lastBackup',todayISO());}
    else if(act==='backup-file'){saveBackupFile();}
    else if(act==='restore'){const v=document.getElementById('restoreText').value.trim(); if(!v){toast('Paste a backup into the box first');return} restoreDraft=v; confirmOpen.restore=true;render();document.getElementById('restoreText').value=restoreDraft;}
    else if(act==='restore-no'){delete confirmOpen.restore;render();}
    else if(act==='restore-yes'){delete confirmOpen.restore;
      if(restoreBackup(restoreDraft)) toast('Restored '+sessions.length+' sessions'); else { render(); toast('That text is not a Lift Log backup'); }}
    else if(act==='reset'){confirmOpen.reset=true;render();}
    else if(act==='reset-no'){delete confirmOpen.reset;render();}
    else if(act==='reset-yes'){delete confirmOpen.reset;program=clone(DEFAULT_PROGRAM);applyDays();saveProgram();render();toast('Programme reset to the original plan');}
    return;
  }
  if(act==='share-week'){ shareText(buildReport('week')); return; }
  if(act==='form' && ex){ formOpen[ex.id]=!formOpen[ex.id]; render(); return; }
  if((act==='sw-go'||act==='sw-reset') && ex){
    if(act==='sw-reset'){ if(sw.id===ex.id){ sw.running=false; sw.acc=0; sw.beeped=false; } render(); return; }
    if(sw.id!==ex.id){ sw.id=ex.id; sw.acc=0; sw.running=false; sw.beeped=false; }
    if(!sw.running){ audioReady(); sw.start=Date.now(); sw.running=true; keepAwake(true); render(); return; }
    // Stop: log the time into the next open set
    sw.acc += Date.now()-sw.start; sw.running=false;
    const secs=Math.round(sw.acc/1000);
    const dd=getDraft(tab); dd.entries[ex.id]=dd.entries[ex.id]||{sets:[]};
    let i=0; while(i<ex.sets && dd.entries[ex.id].sets[i] && dd.entries[ex.id].sets[i].done) i++;
    if(i<ex.sets && secs>0){
      const st=dd.entries[ex.id].sets[i]=dd.entries[ex.id].sets[i]||{};
      st.r=secs; if(st.w==null) st.w=0; st.done=true;
      if(!dd.startedAt) dd.startedAt=new Date().toISOString();
      startRest(ex.rest||60);
      toast('Set '+(i+1)+': '+secs+' s logged');
    } else if(secs>0) toast(secs+' s - all sets already logged');
    sw.acc=0; sw.beeped=false;
    putDraft(dd); render(); return;
  }
  const d=getDraft(tab);
  if(act==='done'&&ex){
    const i=+b.closest('.set').dataset.i;
    d.entries[ex.id]=d.entries[ex.id]||{sets:[]};
    const s=d.entries[ex.id].sets[i]=d.entries[ex.id].sets[i]||{};
    if(!s.done){
      const sug=suggestion(ex);
      if(s.w==null) s.w = (i>0 && d.entries[ex.id].sets[i-1] && d.entries[ex.id].sets[i-1].w!=null) ? d.entries[ex.id].sets[i-1].w : sug.w;
      if(s.r==null) s.r = ex.reps;
      s.done=true; startRest(ex.rest||60);
      if(!d.startedAt) d.startedAt=new Date().toISOString();
      keepAwake(true);
      const tot=(program[tab]||[]).reduce((a,x)=>a+x.sets,0), dn=Object.values(d.entries).reduce((a,e)=>a+(e.sets||[]).filter(x=>x&&x.done).length,0);
      const kNow=(()=>{ try{ const k=sessionKcal(draftToSession(d)); return k?k.total:0; }catch(e){ return 0; } })();
      if(tot && dn>=tot) setTimeout(()=>toast('Every set done · ~'+kNow+' kcal burned so far. Now the cardio.'),400);
      else if(d.entries[ex.id].sets.filter(x=>x&&x.done).length>=ex.sets) setTimeout(()=>toast(ex.name.replace(/\s*\(.*\)\s*$/,'')+' done · ~'+kNow+' kcal so far'),400);
    } else {
      s.done=false;
      if(!anyDone(d)){ delete d.startedAt; keepAwake(false); }
    }
    putDraft(d); render();
  } else if(act==='fill'&&ex){
    const sug=suggestion(ex);
    d.entries[ex.id]=d.entries[ex.id]||{sets:[]};
    for(let i=0;i<ex.sets;i++){const s=d.entries[ex.id].sets[i]=d.entries[ex.id].sets[i]||{}; if(s.w==null) s.w=sug.w; if(s.r==null) s.r=ex.reps;}
    putDraft(d); render();
  } else if(act==='clear'&&ex){delete d.entries[ex.id]; if(!anyDone(d)) delete d.startedAt; putDraft(d);render();}
  else if(act==='rm'){confirmOpen[exId]=true;render();}
  else if(act==='rm-no'){delete confirmOpen[exId];render();}
  else if(act==='rm-yes'){delete confirmOpen[exId];program[tab]=program[tab].filter(x=>x.id!==exId);saveProgram();render();}
  else if(act==='add'){addOpen=true;render();const n=document.getElementById('add-name');if(n)n.focus();}
  else if(act==='add-cancel'){addOpen=false;render();}
  else if(act==='ctype'){const ci=+b.closest('.cardio').dataset.ci; d.cardio[ci].type=b.dataset.v; putDraft(d); render();}
  else if(act==='cadd'){d.cardio.push({type:'treadmill'}); putDraft(d); render();}
  else if(act==='crm'){const ci=+b.closest('.cardio').dataset.ci; d.cardio.splice(ci,1); putDraft(d); render();}
  else if(act==='energy'){const v=+b.dataset.v; d.energy=(d.energy===v)?null:v; putDraft(d); render();}
  else if(act==='rir'&&ex){const v=+b.dataset.v; d.entries[ex.id]=d.entries[ex.id]||{sets:[]}; d.entries[ex.id].rir=(d.entries[ex.id].rir===v)?null:v; putDraft(d); render();}
  else if(act==='edit'&&ex){editOpen[ex.id]=!editOpen[ex.id]; render();}
  else if(act==='fed'){const v=b.dataset.v; d.fedH=(d.fedH===v)?null:v; putDraft(d); render();}
  else if(act==='snack'){const v=b.dataset.v==='1'; d.snack=(d.snack===v)?null:v; putDraft(d); render();}
  else if(act==='pain'){const v=+b.dataset.v;d.back=(d.back===v)?null:v;putDraft(d);render();}
});

function mergeInto(a,b){
  (b.exercises||[]).forEach(e=>{
    const f=(a.exercises=a.exercises||[]).find(x=>x.id===e.id||x.name===e.name);
    if(f){ f.sets=(f.sets||[]).concat(e.sets||[]); if(e.rir!=null) f.rir=e.rir; } else a.exercises.push(e);
  });
  a.cardio=(a.cardio||[]).concat(b.cardio||[]);
  ['energy','back','bw','waist','sleep','fedH','snack','deload'].forEach(k=>{ if(b[k]!=null) a[k]=b[k]; });
  if(a.bwRef==null && b.bwRef!=null) a.bwRef=b.bwRef;
  if(b.notes) a.notes=a.notes?(a.notes+' / '+b.notes):b.notes;
  a.startedAt=a.startedAt||b.startedAt;
  a.endedAt=b.endedAt||b.savedAt||a.endedAt;
  if(a.startedAt && a.endedAt) a.durationMin=Math.max(0,Math.round((new Date(a.endedAt)-new Date(a.startedAt))/60000));
  a.savedAt=b.savedAt||a.savedAt;
  return a;
}
const GAP_MIN=45;
function gapMinutes(prev,next){
  const end=new Date(prev.endedAt||prev.savedAt).getTime(), start=new Date(next.startedAt||next.savedAt).getTime();
  return (start-end)/60000;
}
function joinSplitSessions(){
  const asc=sessions.slice().sort((a,b)=>(a.date+(a.savedAt||'')).localeCompare(b.date+(b.savedAt||'')));
  const out=[];
  asc.forEach(x=>{
    const p=out[out.length-1];
    if(p && p.day===x.day && p.date===x.date && gapMinutes(p,x)<GAP_MIN) mergeInto(p,x); else out.push(x);
  });
  if(out.length!==sessions.length){ sessions=out; LS.set('ppl-sessions',sessions); }
}
function draftToSession(d){
  const exercises=[];
  (program[d.day]||[]).forEach(ex=>{
    const e=d.entries[ex.id]; if(!e) return;
    const sets=e.sets.filter(s=>s && (s.done || s.w!=null || s.r!=null)).map(s=>({w:s.w??null,r:s.r??null}));
    if(sets.length){
      const o={id:ex.id,name:ex.name,assist:!!ex.assist,target:{sets:ex.sets,reps:ex.reps},sets};
      if(ex.repsMax) o.target.repsMax=ex.repsMax;
      if(e.rir!=null) o.rir=e.rir;
      exercises.push(o);
    }
  });
  return {id:newId(),day:d.day,dayLabel:DAYS[d.day]?DAYS[d.day].label:d.day,date:d.date||todayISO(),savedAt:new Date().toISOString(),exercises,
    cardio:(d.cardio||[]).map(c=>{const o={type:c.type||'treadmill'};(CARDIO[o.type]||CARDIO.treadmill).f.forEach(f=>{if(c[f]!=null&&c[f]!=='') o[f]=c[f]});return o}).filter(c=>Object.keys(c).length>1),
    energy:d.energy??null, plan:program.label||'',
    startedAt:d.startedAt||null, endedAt:d.startedAt?new Date().toISOString():null, durationMin:d.startedAt?minsSince(d.startedAt):null,
    back:d.back,bw:d.bw===''||d.bw==null?null:Number(d.bw),waist:d.waist===''||d.waist==null?null:Number(d.waist),notes:(d.notes||'').trim(),
    bwRef: (d.bw===''||d.bw==null) ? bodyWeight() : Number(d.bw),
    sleep: d.sleep===''||d.sleep==null?null:Number(d.sleep), fedH: d.fedH??null, snack: d.snack??null,
    deload: deloadActive() || undefined};
}

let saveArmed=false, saveArmT=null;
function disarmSave(){ saveArmed=false; clearTimeout(saveArmT); const b=document.getElementById('save'); if(b){ b.classList.remove('armed'); b.textContent='Save'; } }
document.getElementById('save').addEventListener('click',async()=>{
  if(!saveArmed){
    saveArmed=true; const b=document.getElementById('save'); b.classList.add('armed'); b.textContent='Tap again to save';
    clearTimeout(saveArmT); saveArmT=setTimeout(disarmSave,4000); return;
  }
  disarmSave();
  const d=getDraft(tab); let s=draftToSession(d);
  if(!s.exercises.length && !s.cardio.length && s.bw==null){toast('Log at least one set or some cardio before saving');return}
  const prev=sortedSessions().find(x=>x.day===s.day && x.date===s.date);
  const joined = prev && gapMinutes(prev,s)<GAP_MIN;
  if(joined) s=mergeInto(prev,s); else sessions.push(s);
  LS.set('ppl-sessions',sessions);
  LS.del(draftKey(tab));
  keepAwake(false);
  const where='on this phone';
  reportMode='last'; tab='report'; LS.set('ppl-tab',tab); render(); window.scrollTo(0,0);
  toast(joined ? 'Added to your '+dayLabel(s)+' session from earlier today' : dayLabel(s)+' session saved '+where);
  shareText(buildReport('last'));
});
document.getElementById('copyToday').addEventListener('click',()=>{
  const d=getDraft(tab), s=draftToSession(d);
  if(!s.exercises.length && !s.cardio.length){shareText(buildReport('last'),null,true);return}
  shareText('LIFT LOG — in progress\n\n'+sessionBlock(s)+foodLine(s.date),null,true);
});

async function deleteSession(id){
  sessions=sessions.filter(s=>s.id!==id); LS.set('ppl-sessions',sessions);
  render();
  toast('Session deleted');
}
function saveProgram(){
  LS.set('ppl-program',program);
}

/* ---------- boot ---------- */
applyDays();
joinSplitSessions();
(function(){
  const inProgress = DAY_TABS.includes(tab) &&(()=>{ const d=getDraft(tab); return anyDone(d) || Object.keys(d.entries||{}).length>0 || (d.cardio||[]).some(c=>Object.keys(c).length>1); })();
  if(!inProgress){ tab=nextUpDay(); LS.set('ppl-tab',tab); }
  else if(anyDone(getDraft(tab))) keepAwake(true);
})();
render();
setInterval(()=>{
  if(!sw.running) return;
  const box=document.querySelector('.sw[data-sw="'+(window.CSS&&CSS.escape?CSS.escape(sw.id):sw.id)+'"]'); if(!box) return;
  const secs=swSeconds(sw.id); box.querySelector('.sw-t').textContent=fmtS(secs);
  const ex=['push','pull','legs','cardio'].map(k=>program[k]||[]).flat().find(x=>x.id===sw.id);
  if(ex && secs>=ex.reps){ box.classList.add('hit'); if(!sw.beeped){ sw.beeped=true; beep(988,180); beep(1319,260,0.25); buzz([150,80,150]); } }
}, 200);
main.addEventListener('change',e=>{
  const t=e.target;
  if(t.hasAttribute && t.hasAttribute('data-photo') && t.files && t.files.length){ const f=[...t.files]; t.value=''; addPhotos(f); }
  else if(t.id==='foodDateIn'){ foodDate = (!t.value || t.value>=todayISO()) ? null : t.value; render(); }
});
function refreshShareLabels(){
  const b=document.getElementById('copyToday'); if(b) b.textContent='Share'+photoCountLabel();
  document.querySelectorAll('[data-act="share"]').forEach(x=>{ x.textContent='Share'+photoCountLabel(); });
}
loadPhotos();
// Live "burned so far" counter in the bottom bar.
var lastBurn=null;
main.addEventListener("input",()=>setTimeout(updateBurn,0));
function liveBurn(){ if(!DAY_TABS.includes(tab)) return null; try{ return sessionKcal(draftToSession(getDraft(tab))); }catch(e){ return null; } }
function updateBurn(){
  const box=document.getElementById('burn'), n=document.getElementById('burnN'); if(!box||!n) return;
  const k=liveBurn();
  if(!k){ box.hidden=true; lastBurn=null; return; }
  box.hidden=false; n.textContent='~'+k.total;
  if(lastBurn!=null && k.total>lastBurn){ n.classList.remove('pop'); void n.offsetWidth; n.classList.add('pop'); }
  lastBurn=k.total;
}
setInterval(()=>{ const el=document.getElementById('elapsed'); if(el) el.textContent=minsSince(el.dataset.start)+' min'; updateBurn(); if(photoDay && photoDay!==todayISO()) loadPhotos(); }, 30000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && photoDay && photoDay!==todayISO()){ foodDate=null; loadPhotos(); } });
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
})();
