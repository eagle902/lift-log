<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1113">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>PPL Lift Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  /* Iron: near-black steel ground, warm chalk-white text */
  --bg:#0F1113; --surface:#181B1E; --surface-2:#202429; --ink:#F2EFEA; --ink-2:#BDB7AE; --ink-3:#8C867D;
  --line:#2A2E33; --line-2:#3A3F46;
  /* Push = power (fire red) · Pull = discipline (steel blue) · Legs = grit (bronze) · Gold = achievement */
  --push:#E0402A; --push-soft:#3A1711; --pull:#3F6FE0; --pull-soft:#152038; --legs:#CF6A1C; --legs-soft:#38210E; --cardio:#22A38F; --cardio-soft:#0E2E2A;
  --gold:#E8B53A; --gold-soft:#3A2D0D;
  --accent:var(--push); --accent-soft:var(--push-soft);
  --ok:#5FBF72; --warn:#E8A33A; --bad:#F0583F;
  --radius:12px;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
body[data-day="push"]{--accent:var(--push);--accent-soft:var(--push-soft)}
body[data-day="pull"]{--accent:var(--pull);--accent-soft:var(--pull-soft)}
body[data-day="legs"]{--accent:var(--legs);--accent-soft:var(--legs-soft)}
body[data-day="cardio"]{--accent:var(--cardio);--accent-soft:var(--cardio-soft)}
body[data-day="report"]{--accent:var(--ink);--accent-soft:var(--surface-2)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;max-width:640px;margin:0 auto}
.brand h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1}
.brand h1 span{color:var(--accent)}
.sync{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.sync.cloud i{background:var(--ok)} .sync.local i{background:var(--warn)}

.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;max-width:640px;margin:10px auto 0}
.tab{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 4px 7px;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:1px}
.tab small{font-family:var(--body);font-size:10.5px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--ink-3)}
.tab[aria-selected="true"]{color:#fff;border-color:transparent}
.tab[aria-selected="true"] small{color:rgba(255,255,255,.82)}
.tab[data-t="push"][aria-selected="true"]{background:var(--push)}
.tab[data-t="pull"][aria-selected="true"]{background:var(--pull)}
.tab[data-t="legs"][aria-selected="true"]{background:var(--legs)}
.tab[data-t="cardio"][aria-selected="true"]{background:var(--cardio)}
.tab{font-size:15.5px;padding:8px 2px 7px}.tab small{font-size:10px}
.cweek{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:8px}
.cweek .big{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;color:var(--accent)}
.cweek .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-2)}
.tab[data-t="report"][aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab[data-t="report"][aria-selected="true"] small{color:var(--bg);opacity:.8}

main{max-width:640px;margin:0 auto;padding:14px 16px 150px;display:flex;flex-direction:column;gap:12px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.meta .focus{font-size:13px;color:var(--ink-2)}
.meta label{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.meta input[type=date]{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:5px 8px;font-size:14px}

.timing{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.timing i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.tab small.next{font-weight:700;color:var(--accent)}
.tab[aria-selected="true"] small.next{color:#fff}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress b{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px 10px}
.ftip-btn{border:0;background:none;color:var(--accent);font-size:12.5px;font-weight:700;padding:4px 0;display:inline-flex;align-items:center;gap:5px}
.ftips{margin-top:8px;padding:9px 11px;border-radius:9px;background:var(--accent-soft);color:var(--ink);font-size:13.5px;line-height:1.5}
.ftips div{display:flex;gap:7px}.ftips div::before{content:"";flex:0 0 5px;height:5px;margin-top:8px;border-radius:50%;background:var(--accent)}
.sw{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;border:1px dashed var(--line-2);border-radius:10px;background:var(--surface-2)}
.sw .sw-t{font-family:var(--display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;min-width:74px;color:var(--ink)}
.sw.running .sw-t{color:var(--accent)}
.sw.hit .sw-t{color:var(--gold)}
.sw small{font-size:11.5px;color:var(--ink-3);flex:1}
.sw button{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:9px 12px;font-weight:700;font-size:14px}
.sw button.go{background:var(--accent);border-color:var(--accent);color:#fff}
.pair{display:inline-block;font-family:var(--display);font-size:14px;font-weight:700;letter-spacing:.04em;color:var(--accent);border:1.5px solid var(--accent);border-radius:6px;padding:0 6px;margin-right:8px;vertical-align:3px}
.ex.complete{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.ex.complete .ex-name::after{content:"  DONE";font-size:12px;letter-spacing:.12em;color:var(--gold);vertical-align:3px}
.progress.full b{background:var(--gold)}
.sync .streak{color:var(--gold);font-weight:600}
.sync i{background:var(--gold)!important}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-name{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.1;letter-spacing:.01em}
.ex-target{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.ex-last{font-size:12.5px;color:var(--ink-2);margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:normal;max-width:100%;}
.chip.hold{background:var(--surface-2);color:var(--ink-2)}
.chip.coach{background:var(--ink);color:var(--bg)}
.coachnote{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0;padding:10px 12px;font-size:13.5px;color:var(--ink-2);white-space:pre-wrap}
.coachnote b{display:block;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid2 label,.cgrid label{font-size:12px;color:var(--ink-3);display:flex;flex-direction:column;gap:3px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cardio{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.cardio .field{background:var(--surface)}
.ctypes{display:flex;flex-wrap:wrap;gap:5px}
.ctypes button,.energy button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600}
.ctypes button[aria-pressed="true"],.energy button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.energy{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.energy button{border-radius:8px;padding:7px 2px;font-size:12px}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1}
.diff{font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px;background:var(--surface-2);border-radius:9px;padding:10px}
.diff b{color:var(--ink)}
.more{border:0;background:none;color:var(--ink-3);font-size:12px;padding:2px 0;white-space:nowrap}
.confirm{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-2)}
.confirm button{border:1px solid var(--line-2);background:var(--surface-2);border-radius:6px;padding:3px 9px;font-size:12px}
.confirm button.danger{background:var(--bad);color:#fff;border-color:transparent}

.sets{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:6px;align-items:center}
.set .n{font-family:var(--display);font-weight:600;color:var(--ink-3);font-size:16px;text-align:center}
.field{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:9px;background:var(--surface-2);overflow:hidden;min-width:0}
.field input{width:100%;min-width:0;border:0;background:transparent;padding:9px 4px 9px 9px;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field input::placeholder{color:var(--ink-3);font-weight:500}
.field span{font-size:11px;color:var(--ink-3);padding-right:8px;white-space:nowrap}
.done{height:40px;border-radius:9px;border:1.5px solid var(--line-2);background:var(--surface);display:grid;place-items:center}
.done svg{width:20px;height:20px;stroke:var(--ink-3)}
.done[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.done[aria-pressed="true"] svg{stroke:#fff}
.set.is-done .field{border-color:var(--accent)}
.set-tools{display:flex;gap:8px;margin-top:4px}
.link{border:0;background:none;color:var(--accent);font-size:12.5px;font-weight:600;padding:4px 0}

.add{border:1.5px dashed var(--line-2);border-radius:var(--radius);padding:12px;background:transparent;color:var(--ink-2);font-weight:600;font-size:14px}
.addform{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addform .full{grid-column:1/-1}
.addform label{font-size:12px;color:var(--ink-3);display:flex;flex-direction:column;gap:3px}
.addform input{border:1px solid var(--line-2);border-radius:8px;background:var(--surface-2);padding:8px;font-size:15px;width:100%}
.addform .row{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
body[data-day="report"] .btn.primary{color:var(--bg)}

.extras{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:12px}
.extras h2,.panel h2{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 label{font-size:12px;color:var(--ink-3);display:flex;flex-direction:column;gap:3px}
.pain{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.pain button{border:1px solid var(--line-2);background:var(--surface-2);border-radius:6px;padding:7px 0;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.pain button[aria-pressed="true"]{color:#fff;border-color:transparent}
.pain-note{font-size:12px;color:var(--ink-3)}
.extras textarea{border:1px solid var(--line-2);border-radius:8px;background:var(--surface-2);padding:8px;font-size:14px;min-height:56px;resize:vertical;width:100%}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:center}
.burn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:54px;padding:4px 6px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2)}
.burn b{font-family:var(--display);font-weight:700;font-size:20px;line-height:1;color:var(--warn);font-variant-numeric:tabular-nums}
.burn b.pop{animation:burnpop .6s ease}
.burn small{font-size:10px;color:var(--ink-3);letter-spacing:.04em}
@keyframes burnpop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.rest{flex:0 0 auto;min-width:78px;border:1px solid var(--line-2);background:var(--surface-2);border-radius:10px;padding:6px 8px;text-align:center;line-height:1.05}
#save.armed{background:var(--gold);border-color:var(--gold);color:#111;font-size:13.5px}
.snd{flex:0 0 44px;height:52px;border:1px solid var(--line-2);background:var(--surface-2);border-radius:10px;display:grid;place-items:center;color:var(--ink-3)}
.snd svg{width:22px;height:22px}
.snd[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.snd .off{display:none}.snd[aria-pressed="false"] .on{display:none}.snd[aria-pressed="false"] .off{display:block}
.rest b{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;display:block}
.rest small{font-size:10.5px;color:var(--ink-3)}
.rest.running{border-color:var(--accent);background:var(--accent-soft)}
.rest.running b{color:var(--accent)}
.rest.over b{color:var(--ok)}
.bar .btn{flex:1;padding:12px 8px;font-size:15px;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;z-index:7;max-width:calc(100% - 32px);text-align:center}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.seg button{border:1px solid var(--line-2);background:var(--surface-2);border-radius:9px;padding:8px 4px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.report{width:100%;min-height:220px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface-2);padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;resize:vertical}
.hint{font-size:12.5px;color:var(--ink-3)}

.prog{width:100%;border-collapse:collapse;font-size:13.5px}
.prog th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;text-align:left;padding:4px 6px 6px;border-bottom:1px solid var(--line)}
.prog td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.prog td.r,.prog th.r{text-align:right}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.up{color:var(--ok);font-weight:600} .flat{color:var(--ink-3)} .down{color:var(--bad);font-weight:600}
.spark{width:64px;height:20px;display:block}

.hist{display:flex;flex-direction:column;gap:8px}
.h-item{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface-2)}
.h-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.h-title{font-family:var(--display);font-weight:600;font-size:17px}
.h-sub{font-size:12px;color:var(--ink-3)}
.h-body{font-size:12.5px;color:var(--ink-2);margin-top:6px;white-space:pre-wrap}
.empty{font-size:13.5px;color:var(--ink-3);text-align:center;padding:14px}
/* v2 additions */
.tabs{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tab{font-size:15px;letter-spacing:.02em;padding:8px 2px 7px;overflow:hidden;min-width:0}
.tab small{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab[aria-selected="true"]{background:var(--accent)}
body[data-day="test"] .tab[aria-selected="true"]{color:#111}
body[data-day="test"] .tab[aria-selected="true"] small{color:#111;opacity:.8}
body[data-day="food"]{--accent:var(--gold);--accent-soft:var(--gold-soft)}
body[data-day="food"] .tab[aria-selected="true"],body[data-day="food"] .btn.primary{color:#111}
body[data-day="food"] .tab[aria-selected="true"] small{color:#111;opacity:.8}
body[data-day="more"]{--accent:var(--ink-2);--accent-soft:var(--surface-2)}
body[data-day="more"] .tab[aria-selected="true"]{color:var(--bg,#111)}
.subseg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px}
.subseg button{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 2px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;line-height:1.1}
.subseg button small{font-family:var(--body);text-transform:none;font-size:9.5px;font-weight:600;color:var(--ink-3);letter-spacing:0}
.subseg button small.next{color:var(--warn)}
.subseg button[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:#fff}
.subseg button[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
body[data-day="test"] .subseg button[aria-pressed="true"],body[data-day="test"] .subseg button[aria-pressed="true"] small{color:#111}
.foodbox textarea{min-height:130px;font-size:15px}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchips button{border:1px solid var(--line-2);background:var(--surface-2);border-radius:999px;padding:6px 11px;font-size:13px;color:var(--ink)}
.fchips button:active{background:var(--accent);color:#111}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.ph{position:relative;width:86px;height:86px;border-radius:10px;overflow:hidden;border:1px solid var(--line-2);background:var(--surface-2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.sent img{opacity:.45}
.ph .tagp{position:absolute;left:4px;bottom:4px;font-size:10px;font-weight:700;padding:1px 5px;border-radius:6px;background:rgba(0,0,0,.65);color:#fff}
.ph .x{position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:14px;line-height:24px;padding:0}
.camrow{display:flex;gap:8px}
.camrow label{flex:1;text-align:center}
body[data-day="test"]{--accent:var(--gold);--accent-soft:var(--gold-soft)}
body[data-day="test"] .btn.primary{color:#111}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chips button{border:1px solid var(--line-2);background:var(--surface-2);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600;min-width:34px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
body[data-day="test"] .chips button[aria-pressed="true"]{color:#111}
.chips .lbl{font-size:12px;color:var(--ink-3);margin-right:2px}
.rir{margin-top:8px}

<script>
(function(){

 "Aim: breathing harder but still able to talk (heart rate around 110-125).";

ust wider than shoulders\nStart from straight arms at the bottom - full hang\nPull chest toward the bar until chin is over it\nLower all the way under control; no half reps", "leg-press": "Back and hips flat on the pad - don't let hips curl up\nFeet shoulder width, middle of the platform\nLower until knees reach about 90 degrees\nPress through the whole foot; don't lock knees hard", "shoulder-press": "Back flat against the pad, core braced\nHandles start at about chin height\nPress up without locking elbows hard\nLower with control; no arching the lower back", "assisted-dip": "Lean slightly forward for chest\nShoulders down, away from your ears\nLower until upper arms are about parallel - not deeper\nPress up without locking elbows hard", "farmer": "Stand tall, shoulders back and down\nGrip hard, arms straight at your sides\nShort steady steps, look ahead\nDon't lean or let the weights swing", "side-plank": "Elbow under shoulder, body in one straight line\nHips up - don't let them sag\nStomach tight, breathe normally\nKnees down if you need an easier version", "dead-hang": "Overhand grip, shoulder width\nShoulders slightly pulled down - not shrugged to ears\nBody still, legs together, breathe\nStep down before the grip fails", "sg-goblet": "Hold the dumbbell close against your chest\nSit back onto the bench, chest up\nTouch the bench lightly - don't collapse\nStand up through the whole foot", "sg-pulldown": "Lean back slightly, chest up\nPull to upper chest, elbows down\nControl the way up", "sg-chest-press": "Handles at mid-chest height\nShoulder blades back against the pad\nPress out, don't lock elbows hard; return slowly", "sg-row": "Sit tall, slight knee bend\nPull to lower ribs, squeeze shoulder blades\nDon't rock back and forth", "sg-leg-curl": "Knees in line with the pivot\nCurl smoothly, lower slowly\nHips stay on the pad", "sg-reverse-fly": "Chest against the pad, arms slightly bent\nOpen arms wide, squeeze the back of the shoulders\nReturn slowly; light weight", "back-ext": "Hips on the pad, feet locked in\nCross arms on your chest\nLower slowly, rise to a straight line - never arch past it\nSkip if your back goes above 2/10", "chest-press": "Handles at mid-chest height\nShoulder blades back against the pad\nPress out, don't lock elbows hard; return slowly", "ab-crunch": "Curl your ribs toward your hips\nExhale as you crunch, slow on the way back\nDon't pull with your arms", "tricep-pushdown": "Elbows pinned to your sides\nPush down until arms are straight, squeeze\nControl it back up to about 90 degrees", "cable-curl": "Elbows still at your sides\nCurl up, squeeze at the top\nLower slowly, arms fully straight at the bottom", "sl-leg-press": "45° sled only, start light\nBack flat on the pad, one foot mid-platform\nControl down to about 90 degrees, press through the heel"};

const DEFAULT_PROGRAM = {
  push:[

    {id:'chest-press',name:'Chest press machine',sets:4,reps:10,rest:60,hint:30,step:2.5},

    {id:'seated-row',name:'Seated cable row (pulley)',sets:4,reps:10,rest:60,hint:42.5,step:2.5},
    {id:'assisted-pullup',name:'Assisted pull-up',sets:3,reps:8,rest:60,hint:17.5,step:2.5,assist:true},

};

const CARDIO = {
  treadmill:{label:'Treadmill', f:['min','km','speed','incline','elev','avgHr','maxHr','kcal']},
  stairs:{label:'Stairs', f:['min','floors','level','avgHr','maxHr','kcal']},
  rower:{label:'Rowing', f:['min','m','split','spm','avgHr','kcal']},
  elliptical:{label:'Elliptical', f:['min','km','level','watts','avgHr','maxHr','kcal']},
  bike:{label:'Bike', f:['min','km','level','rpm','avgHr','kcal']},
  outdoor:{label:'Outdoor walk', f:['min','km','elev','steps','avgHr','kcal']}
};
const CF = {
  min:['Time','min','time'], watts:['Power','W','numeric'], km:['Distance','km','decimal'], speed:['Avg speed','km/h','decimal'],
  incline:['Incline','%','decimal'], avgHr:['Avg HR','bpm','numeric'], maxHr:['Max HR','bpm','numeric'],
  kcal:['Calories','kcal','numeric'], floors:['Floors','','numeric'], level:['Level','','numeric'],
  m:['Distance','m','numeric'], split:['Avg /500 m','m:ss','text'], spm:['Stroke rate','/min','numeric'],
  rpm:['Cadence','rpm','numeric'], elev:['Climb','m','numeric'], steps:['Steps','','numeric']
};
function parseMin(v){
  if(v==null||v==='') return 0;
  const t=String(v).trim().replace(',', '.');
  if(t.includes(':')){ const p=t.split(':').map(Number); if(p.some(isNaN)) return 0;
    return p.length===3 ? p[0]*60+p[1]+p[2]/60 : p[0]+p[1]/60; }
  const n=Number(t); return isNaN(n)?0:n;
}
function fmtMin(v){ const t=String(v).trim(); return t.includes(':') ? t+' min' : (Math.round(parseMin(t)*10)/10)+' min'; }
function cardioText(c){
  const def = CARDIO[c.type] || CARDIO.treadmill, parts=[];
  const v = k => c[k]!=null && c[k]!=='';
  if(v('min')) parts.push(fmtMin(c.min)); else if(cardioEntryMin(c)) parts.push('≈'+Math.round(cardioEntryMin(c))+' min (from distance ÷ speed)');
  if(v('km')) parts.push(c.km+' km');
  if(v('m')) parts.push(c.m+' m');
  if(v('speed')) parts.push(c.speed+' km/h');
  if(v('incline')) parts.push(c.incline+'% incline');
  if(v('floors')) parts.push(c.floors+' floors');
  if(v('level')) parts.push('level '+c.level);
  if(v('split')) parts.push(c.split+' /500m');
  if(v('spm')) parts.push(c.spm+' spm');
  if(v('rpm')) parts.push(c.rpm+' rpm');
  if(v('watts')) parts.push(c.watts+' W');
  if(v('elev')) parts.push(c.elev+' m climb');
  if(v('steps')) parts.push(c.steps+' steps');
  if(v('avgHr')||v('maxHr')) parts.push('HR '+(v('avgHr')?c.avgHr+' avg':'')+(v('avgHr')&&v('maxHr')?' / ':'')+(v('maxHr')?c.maxHr+' max':''));
  if(v('kcal')) parts.push(c.kcal+' kcal');
  return def.label+': '+(parts.join(' · ')||'no details');
}
// Minutes for one cardio entry; if the time box was left empty, work it out from distance and speed.
function cardioEntryMin(c){
  const m=parseMin(c.min); if(m) return m;
  const km=Number(c.km), sp=Number(c.speed);
  return (km>0 && sp>0) ? km/sp*60 : 0;
}
function cardioMinutes(s){
  if(Array.isArray(s.cardio)) return Math.round(s.cardio.reduce((a,c)=>a+cardioEntryMin(c),0));

/* ---------- estimated calories ----------
   Walking/running: ACSM metabolic equations (speed and grade), 5 kcal per litre of oxygen.
   Other machines and lifting: MET values from the Compendium of Physical Activities
   (lifting with rests 3.5, bodyweight/mobility 2.8, elliptical 5.0, rowing 6.0, bike 5.5, stairs 8.8).
   Gross calories; "above resting" removes 1 MET (what you would burn sitting). Treat as ±20%. */
const MET = {lift:3.5, light:2.8, elliptical:5.0, rower:6.0, bike:5.5, stairs:8.8, treadmill:4.3, outdoor:4.0};
function cardioKcal(c, bw){
  const min=cardioEntryMin(c), type=c.type||'treadmill';
  if(!min) return {kcal: Number(c.kcal)||0, min:0, machine: Number(c.kcal)||0};
  let kcal;
  if(type==='treadmill' || type==='outdoor'){
    const km=Number(c.km)||0;
    const kmh = Number(c.speed) || (km ? km/(min/60) : 0);
    let grade = c.incline!=null && c.incline!=='' ? Number(c.incline)/100 : (km && Number(c.elev) ? Number(c.elev)/(km*1000) : 0);
    grade=Math.max(0, Math.min(0.2, grade||0));
    if(kmh>0){
      const S=kmh*1000/60; // m/min
      const vo2 = kmh>=8 ? 3.5+0.2*S+0.9*S*grade : 3.5+0.1*S+1.8*S*grade;
      kcal = vo2*bw/1000*5*min;
    } else kcal = MET[type]*bw*min/60;
  } else if(type==='bike' && Number(c.watts)>0){
    kcal = Number(c.watts)*min*60/1000/0.22/4.184 + bw*min/60;
  } else kcal = (MET[type]||5)*bw*min/60;
  return {kcal:Math.round(kcal), min, machine:Number(c.kcal)||0};
}
function sessionKcal(s){
  if(!s) return null;

    // Time from first ticked set to save; early in a session (or with no clock) use sets × (rest + ~35 s), whichever is larger.
    const bySets=exs.reduce((a,e)=>{ const pe=(program[s.day]||[]).find(x=>x.id===e.id); return a+(e.sets||[]).length*(((pe&&pe.rest)||60)+35)/60; },0);

  }
  (Array.isArray(s.cardio)?s.cardio:[]).forEach(c=>{
    const r=cardioKcal(c,bw); if(!r.kcal) return;
    parts.push({label:(CARDIO[c.type]||CARDIO.treadmill).label.toLowerCase()+(r.min?' '+Math.round(r.min)+' min':''), kcal:r.kcal, machine:r.machine});
    total+=r.kcal; mins+=r.min;
  });
  if(!total) return null;
  const above=Math.max(0, Math.round(total - bw*mins/60));
  return {total:Math.round(total), above, parts};
}

/* ---------- storage helpers ---------- */

// Local calendar date (Korea is UTC+9, so toISOString() alone gives yesterday before 9 am).
const localISO = dt => {const d=new Date(dt);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};

const kg = v => (v==null||v==='')?'':(Math.round(Number(v)*100)/100).toString();

const minsSince = iso => Math.max(0, Math.round((Date.now()-new Date(iso).getTime())/60000));

  return (rot.length?rot:['push','pull','legs']).reduce((a,b) => last[b] < last[a] ? b : a);

const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

let program = LS.get('ppl-program', clone(DEFAULT_PROGRAM));
let sessions = LS.get('ppl-sessions', []);         // all sessions, stored on this phone

/* ---------- food log ---------- */
const FOOD_SEEDS=['no breakfast','coffee','banana + dates','sourdough + honey','dried figs 3','dried apricots 3'];
const curFoodDate = () => foodDate || todayISO();
function setFood(date, text){ if(text && text.trim()) foods[date]=text; else delete foods[date]; LS.set('ppl-food', foods); }
function foodItems(text){
  return String(text||'').split(/\n|·|;|,|\+/).map(x=>x.replace(/^\s*(food:)?\s*\d{1,2}[:.]\d{2}\s*/i,'').trim()).filter(x=>x && x.length<=40);
}
function foodChips(){
  const m=new Map();
  Object.keys(foods).sort().forEach(d=>foodItems(foods[d]).forEach(it=>{
    const k=it.toLowerCase().replace(/\s+/g,' '); const o=m.get(k)||{label:it,n:0,last:''}; o.n++; o.last=d; o.label=it; m.set(k,o);
  }));
  const list=[...m.values()].sort((a,b)=>b.n-a.n || b.last.localeCompare(a.last)).map(o=>o.label).slice(0,24);
  FOOD_SEEDS.forEach(x=>{ if(list.length<12 && !list.some(y=>y.toLowerCase()===x)) list.push(x); });
  return list;
}
const hhmm = () => { const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
function appendFood(item){
  const date=curFoodDate(), isToday=date===todayISO();
  let t=(foods[date]||'').replace(/\s+$/,'');
  const lines=t?t.split('\n'):[], last=lines[lines.length-1]||'';
  const m=last.match(/^(\d{1,2}):(\d{2})/);
  const now=new Date(), nowMin=now.getHours()*60+now.getMinutes();
  if(isToday && m && Math.abs(nowMin-(Number(m[1])*60+Number(m[2])))<=30) lines[lines.length-1]=last+' + '+item;
  else lines.push((isToday?hhmm()+' ':'')+item);
  setFood(date, lines.join('\n'));
}
function foodLine(date){ const t=foods[date]; return t ? '\n\nFOOD — '+fmtDate(date)+'\n'+t.trim() : ''; }
function foodWeekText(){
  const out=[]; for(let i=6;i>=0;i--){ const d=daysAgoISO(i); if(foods[d]) out.push(fmtDate(d)+': '+foods[d].trim().split('\n').join(' · ')); }
  return out.length ? '\n\nFOOD (last 7 days)\n'+out.join('\n') : '';
}

  let h='<section class="panel foodbox"><h2>Food · '+esc(isToday?'today':fmtDate(date))+'</h2>'+
    '<div class="mini">Day<div class="field" style="max-width:170px"><input type="date" id="foodDateIn" value="'+esc(date)+'" max="'+esc(todayISO())+'"></div>'+(isToday?'':'<button type="button" class="link" data-act="food-today">back to today</button>')+'</div>'+

    '<div class="hint">Rough amounts are fine (slices, cups, pieces, a hand-sized portion). Add the brand for packaged things the first time. "No breakfast" is useful too.</div>'+

/* ---------- photos: kept on the phone until shared, removed the day after sharing ---------- */
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('liftlog',1);
  r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains('photos')) r.result.createObjectStore('photos',{keyPath:'id'}); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function idbReq(mode, fn){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction('photos',mode), st=tx.objectStore('photos'); const q=fn(st);
  tx.oncomplete=()=>{ res(q&&q.result); db.close(); }; tx.onerror=()=>{ rej(tx.error); db.close(); }; })); }
const idbAll = () => idbReq('readonly', st=>st.getAll());
const idbPut = rec => idbReq('readwrite', st=>st.put(rec));
const idbDel = id => idbReq('readwrite', st=>st.delete(id));
let photoDay=null;
async function loadPhotos(){
  try{
    const all=await idbAll(), today=todayISO(); photoDay=today;
    const keep=[];
    for(const r of all){ if(r.sent && r.sent<today) await idbDel(r.id); else keep.push(r); }   // only photos already shared on an earlier day
    photoCache.forEach(p=>{ try{ URL.revokeObjectURL(p.url); }catch(e){} });
    photoCache=keep.sort((a,b)=>a.at-b.at).map(r=>({id:r.id,date:r.date,at:r.at,sent:r.sent||null,blob:r.blob,url:URL.createObjectURL(r.blob)}));
  }catch(e){ photoCache=[]; }
  render();
}
function shrink(file){
  return new Promise(res=>{
    if(!window.createImageBitmap){ res(file); return; }
    createImageBitmap(file,{imageOrientation:'from-image'}).then(bm=>{
      const k=Math.min(1,1600/Math.max(bm.width,bm.height)), c=document.createElement('canvas');
      c.width=Math.round(bm.width*k); c.height=Math.round(bm.height*k);
      c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
      c.toBlob(b=>res(b||file),'image/jpeg',0.82);   // re-encoding also drops location data
    }).catch(()=>res(file));
  });
}
async function addPhotos(files){
  let n=0;
  for(const f of files){ try{ const b=await shrink(f); await idbPut({id:newId(),date:todayISO(),at:Date.now(),blob:b,sent:null}); n++; }catch(e){} }
  await loadPhotos();
  toast(n ? n+' photo'+(n>1?'s':'')+' kept · they go with your next Share' : 'Could not keep that photo');
}
function photoCountLabel(){ const n=photoCache.filter(p=>!p.sent).length; return n?' +'+n+' 📷':''; }
function photoFiles(list){ return list.map((p,i)=>new File([p.blob],'liftlog-'+p.date+'-'+(i+1)+'.jpg',{type:p.blob.type||'image/jpeg'})); }
function sharePhotos(text, fallbackEl){
  const unsent=photoCache.filter(p=>!p.sent), files=photoFiles(unsent);
  let ok=false; try{ ok=!!(navigator.share && navigator.canShare && navigator.canShare({files})); }catch(e){}
  if(!ok){ toast('This browser cannot attach photos — they are kept. Text only.'); shareText(text, fallbackEl); return; }
  navigator.share({title:'Lift Log', text, files}).then(async()=>{
    const day=todayISO();
    for(const p of unsent){ try{ await idbPut({id:p.id,date:p.date,at:p.at,blob:p.blob,sent:day}); }catch(e){} }
    await loadPhotos();
    toast(unsent.length+' photo'+(unsent.length>1?'s':'')+' shared · kept until tomorrow in case you need to send again');
  }).catch(err=>{
    if(err && err.name==='AbortError') toast('Not shared — photos kept');
    else { toast('Photos could not be shared — they are kept'); copyText(text, fallbackEl); }
  });
}
function photoBlockHTML(){
  const un=photoCache.filter(p=>!p.sent), sent=photoCache.filter(p=>p.sent);
  let h='<div class="camrow"><label class="btn">📷 Take photo<input type="file" accept="image/*" capture="environment" data-photo hidden></label>'+
    '<label class="btn">From gallery<input type="file" accept="image/*" multiple data-photo hidden></label></div>';
  if(photoCache.length){
    h+='<div class="photos">'+photoCache.map(p=>'<div class="ph'+(p.sent?' sent':'')+'"><img src="'+p.url+'" alt="">'+
      '<span class="tagp">'+(p.sent?'sent':esc(p.date===todayISO()?'today':fmtDate(p.date)))+'</span>'+
      (confirmOpen['ph:'+p.id]
        ? ''
        : '<button type="button" class="x" data-act="ph-del" data-id="'+esc(p.id)+'" aria-label="Delete photo">×</button>')+'</div>').join('')+'</div>';
    const ask=photoCache.find(p=>confirmOpen['ph:'+p.id]);
    if(ask) h+='<div class="confirm">This photo has not been sent yet. Delete it? <button type="button" class="danger" data-act="ph-del-yes" data-id="'+esc(ask.id)+'">Delete</button><button type="button" data-act="ph-del-no" data-id="'+esc(ask.id)+'">Keep</button></div>';
  }
  h+='<div class="hint">'+(un.length?'<b style="color:var(--ink)">'+un.length+' waiting</b> — they go with your next Share (food, session or report). ':'')+
    'Photos stay only in this app (not in your gallery) and are never removed before you share them. After sharing they are kept until tomorrow, then deleted.</div>';
  if(sent.length) h+='<button type="button" class="link" data-act="ph-resend">Send today\'s shared photos again ('+sent.length+')</button>';
  return h;
}
function photoAction(act,b){
  const id=b.dataset.id, p=photoCache.find(x=>x.id===id);
  if(act==='ph-del'&&p){ if(p.sent){ idbDel(id).then(loadPhotos); } else { confirmOpen['ph:'+id]=true; render(); } return true; }
  if(act==='ph-del-no'){ delete confirmOpen['ph:'+id]; render(); return true; }
  if(act==='ph-del-yes'){ delete confirmOpen['ph:'+id]; idbDel(id).then(loadPhotos); toast('Photo deleted'); return true; }
  if(act==='ph-resend'){
    const files=photoFiles(photoCache.filter(x=>x.sent));
    try{ if(navigator.canShare && navigator.canShare({files})) navigator.share({title:'Lift Log photos',files}).catch(()=>{}); else toast('This browser cannot share photos'); }catch(e){ toast('This browser cannot share photos'); }
    return true;
  }
  return false;
}

async function parsePlan(txt){
  const at = txt.indexOf('code:');
  let raw = at>=0 ? txt.slice(at+5) : txt;
  raw = raw.split(')')[0].replace(/\s+/g,'');
  let zipped=false; if(raw.startsWith('Z.')){ zipped=true; raw=raw.slice(2); }
  raw = raw.replace(/-/g,'+').replace(/_/g,'/');
  const bin = atob(raw);
  let bytes = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  if(zipped){
    if(typeof DecompressionStream==='undefined') throw new Error('old');
    const buf = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
    bytes = new Uint8Array(buf);
  }
  const o = JSON.parse(new TextDecoder().decode(bytes));
  if(!o || o.app!=='liftlog-plan' || !o.program || !Array.isArray(o.program.push) || !Array.isArray(o.program.pull) || !Array.isArray(o.program.legs)) throw new Error('bad');
  return o;
}
function planDiff(o){
  const lines=[];
  ['push','pull','legs','cardio'].forEach(day=>{
    const oldL=program[day]||[], newL=o.program[day]||[];
    if(day==='cardio' && !oldL.length && !newL.length) return;
    const L=(o.days&&o.days[day]&&o.days[day].label)||DAYS[day].label;
    if(o.days&&o.days[day]&&o.days[day].label&&o.days[day].label!==DAYS[day].label) lines.push(DAYS[day].label+' tab becomes '+o.days[day].label);
    newL.forEach(n=>{
      const old=oldL.find(x=>x.id===n.id);
      if(!old){lines.push(L+': add '+n.name+' '+n.sets+'×'+n.reps+(n.repsMax?'–'+n.repsMax:'')+(n.coach&&n.coach.w!=null?' at '+kg(n.coach.w)+' kg':''));return}
      const ch=[];
      if(old.name!==n.name) ch.push('renamed '+n.name);
      if(old.sets!==n.sets||old.reps!==n.reps||(old.repsMax||0)!==(n.repsMax||0)) ch.push(n.sets+'×'+n.reps+(n.repsMax?'–'+n.repsMax:''));
      if(old.rest!==n.rest) ch.push(n.rest+' s rest');
      if(n.coach&&n.coach.w!=null) ch.push('target '+kg(n.coach.w)+' kg');
      if(ch.length) lines.push(L+': '+n.name+' → '+ch.join(', '));
    });
    oldL.forEach(x=>{ if(!newL.find(n=>n.id===x.id)) lines.push(L+': remove '+x.name); });
    const oi=oldL.map(x=>x.id).filter(id=>newL.some(n=>n.id===id)).join(), ni=newL.map(x=>x.id).filter(id=>oldL.some(n=>n.id===id)).join();
    if(oi!==ni) lines.push(L+': new exercise order');
    if(newL.some(n=>n.form)) lines.push(L+': form tips on '+newL.filter(n=>n.form).length+' exercises');
    if(o.notes && o.notes[day]) lines.push(L+': session notes updated');
  });
  return {title:'Plan '+(o.label||'update')+' — '+lines.length+' changes', lines: lines.length?lines:['No changes to exercises']};
}

/* ---------- history helpers ---------- */
function sortedSessions(){return sessions.slice().sort((a,b)=> (b.date+b.savedAt).localeCompare(a.date+a.savedAt))}
function lastEntryFor(ex, beforeDate){
  for(const s of sortedSessions()){
    if(beforeDate && s.date > beforeDate) continue;
    const e = (s.exercises||[]).find(x => x.id===ex.id || x.name===ex.name);
    if(e && e.sets && e.sets.some(t=>t.w!=null||t.r!=null)) return {session:s, entry:e};
  }
  return null;
}
function topWeight(sets, assist){
  const ws = sets.filter(s=>s.w!=null && s.w!=='' ).map(s=>Number(s.w));
  if(!ws.length) return null;
  return assist ? Math.min(...ws) : Math.max(...ws);
}
function suggestion(ex){
  if(ex.coach && ex.coach.w!=null && ex.coach.setAt){
    const done = sessions.some(s => (s.savedAt||'') > ex.coach.setAt && (s.exercises||[]).some(e=>e.id===ex.id||e.name===ex.name));
    if(!done) return {w:ex.coach.w, kind:'coach', text:'Plan: '+((isBodyOnly(ex)||isTimed(ex))&&!ex.coach.w ? ex.reps+(isTimed(ex)?' s':' reps') : kg(ex.coach.w)+' kg'+(ex.assist?' assist':''))+(ex.coach.note?' · '+ex.coach.note:'')};
  }
  const last = lastEntryFor(ex);
  if(isBodyOnly(ex)){
    const u=isTimed(ex)?' s':' reps';
    const best = last ? Math.max(0,...last.entry.sets.map(t=>Number(t.r)||0)) : 0;
    if(!best) return {w:0, kind:'start', text:'Aim for '+ex.reps+u};
    if(best>=ex.reps) return {w:0, kind:'up', text:'Last best '+best+u+' — aim for '+(best+(isTimed(ex)?5:1))+u};
    return {w:0, kind:'hold', text:'Last best '+best+u+' — aim for '+ex.reps+u};
  }
  if(!last) return {w:ex.hint, kind:'start', text:'Start around '+kg(ex.hint)+' kg'};
  const sets = last.entry.sets.filter(s=>s.w!=null && s.w!=='');
  const top = topWeight(sets, ex.assist);
  if(top==null) return {w:ex.hint, kind:'start', text:'Start around '+kg(ex.hint)+' kg'};
  const step = ex.step || 2.5;
  const uniform = sets.every(s => Number(s.w) === Number(sets[0].w));
  if(!uniform){
    // Weight changed between sets: settle on one working weight first (the middle of what was used).
    const ws = sets.map(s=>Number(s.w)).sort((a,b)=>a-b);
    const mid = ws.length%2 ? ws[(ws.length-1)/2] : (ws[ws.length/2-1]+ws[ws.length/2])/2;
    const w = Math.floor(mid/step)*step || ws[0];
    return {w, kind:'hold', text:'Pick one weight: '+kg(w)+' kg on all '+ex.sets+' sets'};
  }
  const enough = sets.length >= ex.sets;
  const minR = Math.min(...sets.map(s=>Number(s.r)||0));
  const rir = last.entry.rir;
  const up = () => { const w = ex.assist ? Math.max(0, top-step) : top+step;
    return {w, kind:'up', text: ex.assist ? 'Top of range hit — drop assist to '+kg(w)+' kg' : 'Top of range hit — try '+kg(w)+' kg'+(ex.repsMax?' for '+ex.reps+' reps':'')}; };
  if(ex.repsMax && ex.repsMax>ex.reps && !isTimed(ex)){
    // Double progression: add reps inside the range first, then weight once every set reaches the top.
    if(enough && minR >= ex.repsMax) return up();
    if(enough && minR >= ex.reps){
      const aim = Math.min(ex.repsMax, minR+1);
      return {w:top, kind:'hold', text:'Same '+kg(top)+' kg, aim for '+aim+'+ reps on every set (range '+ex.reps+'–'+ex.repsMax+')'};
    }
    return {w:top, kind:'hold', text:'Stay at '+kg(top)+' kg until every set reaches '+ex.reps+' reps'+(rir===0?' · last set was to failure, stop 1–2 short':'')};
  }
  const allHit = enough && minR >= ex.reps;
  if(allHit){
    if(rir===0) return {w:top, kind:'hold', text:'All reps hit, but only at failure — repeat '+kg(top)+' kg once more'};
    const w = ex.assist ? Math.max(0, top-step) : top+step;
    return {w, kind:'up', text: ex.assist ? 'All reps hit — drop assist to '+kg(w)+' kg' : 'All reps hit — try '+kg(w)+' kg'};
  }
  return {w:top, kind:'hold', text:'Stay at '+kg(top)+' kg until all '+ex.sets+'×'+ex.reps+' are clean'+(rir===0?' · last set was to failure, stop 1–2 short':'')};
}
function setsText(sets, ex){
  const f=sets.filter(s=>s.w!=null||s.r!=null);
  if(ex && (isTimed(ex)||isBodyOnly(ex)) && f.every(s=>!Number(s.w)))
    return f.map(s=>(s.r!=null&&s.r!==''?s.r:'?')+(isTimed(ex)?' s':'')).join(', ');
  return f.map(s=>(s.w!=null&&s.w!==''?kg(s.w):'bw')+'×'+(s.r!=null&&s.r!==''?s.r:'?')).join(', ');
}

  })();
  const nu = nextUpDay(), SUB={push:DAYS.push.sub||'',pull:DAYS.pull.sub||'',legs:DAYS.legs.sub||''};

const DEFAULT_BW = 83.7;
function bodyWeight(){ const b=sortedSessions().find(x=>x.bw); return b?Number(b.bw):DEFAULT_BW; }
// Body weight on a given date: the nearest weigh-in on or before it, else the first one after it.
function bodyWeightAt(date){
  const w=sessions.filter(x=>x.bw).sort((a,b)=>a.date.localeCompare(b.date));
  if(!w.length) return DEFAULT_BW;
  let pick=w[0]; w.forEach(x=>{ if(x.date<=date) pick=x; });
  return Number(pick.bw);
}
function sessionBW(s){ return s ? Number(s.bw || s.bwRef || bodyWeightAt(s.date)) : bodyWeight(); }
// One number per session, scored so weight AND reps both count.
// Weighted: estimated one-rep max (Epley, w x (1 + reps/30)).
// Assisted: same, using the weight you actually lift (that day's body weight minus help).
// Carries: kg x steps (load moved). Timed: seconds held. Bodyweight-only: reps.
function isCarry(ex){ return ex.metric==='carry' || /carry/i.test(ex.name||'') || ex.id==='farmer'; }
function perfKind(ex){ if(isTimed(ex)) return 's'; if(isCarry(ex)) return 'carry'; if(!ex.assist && !(ex.coach&&ex.coach.w) && !ex.hint) return 'reps'; return 'kg'; }
const KIND_UNIT = {s:' s', reps:' reps', carry:' kg×steps', kg:' score'};
function perfOf(sets, ex, sess){
  const kind=perfKind(ex), bw=sessionBW(sess); const vals=[];
  (sets||[]).forEach(t=>{
    const r=Number(t.r), w=Number(t.w)||0; if(!r) return;
    if(kind==='s'||kind==='reps') vals.push(r);
    else if(kind==='carry'){ if(w) vals.push(w*r); }
    else { const lifted = ex.assist ? Math.max(0,bw-w) : w; if(lifted) vals.push(lifted*(1+r/30)); }
  });
  if(!vals.length) return null;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*2)/2;  // average of all sets, so fading sets count
}
function progressRows(){
  const rows=[], seen=new Set();
  ['push','pull','legs','cardio'].forEach(day=>{
    (program[day]||[]).forEach(ex=>{
      if(seen.has(ex.id)) return; seen.add(ex.id);
      const pts=[];
      sortedSessions().slice().reverse().forEach(s=>{
        const e=(s.exercises||[]).find(x=>x.id===ex.id||x.name===ex.name);
        if(e){const v=perfOf(e.sets,ex,s); if(v!=null) pts.push({date:s.date,w:v});}
      });
      rows.push({day,ex,pts,kind:perfKind(ex)});
    });
  });
  return rows;
}
function trendColor(d, assist){
  if(!d) return 'var(--ink-3)';
  const better = assist ? d<0 : d>0;
  return better ? 'var(--ok)' : (assist ? 'var(--ink-3)' : 'var(--bad)');
}
function spark(pts, color, dotColor){
  if(pts.length<2) return '';
  const W=64,H=20,p=2, ws=pts.map(x=>x.w), mn=Math.min(...ws), mx=Math.max(...ws), r=(mx-mn)||1;
  const xy=pts.map((x,i)=>[p+i*(W-2*p)/(pts.length-1), H-p-(x.w-mn)/r*(H-2*p)]);
  const last=xy[xy.length-1];
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><polyline fill="none" stroke="'+color+'" stroke-width="1.6" stroke-linejoin="round" points="'+xy.map(a=>a[0].toFixed(1)+','+a[1].toFixed(1)).join(' ')+'"/><circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.4" fill="'+(dotColor||color)+'"/></svg>';
}

  h += '<section class="panel"><h2>Programme</h2><div class="hint">Removed or added exercises? You can put the day back to the original plan.</div>'+
    (confirmOpen.reset?'<div class="confirm">Reset all three days to the original plan? <button type="button" class="danger" data-act="reset-yes">Reset</button><button type="button" data-act="reset-no">Cancel</button></div>':'<button type="button" class="btn" data-act="reset">Reset programme to original plan</button>')+
    '</section>';

/* ---------- check-in, RIR and daily habits ---------- */
const rirLabel = v => v>=3 ? '3+' : String(v);
const FED = ['<1','1-2','2-3','3-4','4+'];
const longGap = v => v==='3-4' || v==='4+';
function checkinText(s){

function checkinHTML(d){

function todayHabits(){ return habits[todayISO()] || {}; }
function setHabit(k, v){
  const t=todayISO(), o=Object.assign({}, habits[t]||{}); o[k]=v; habits[t]=o;
  const cut=daysAgoISO(180); Object.keys(habits).forEach(x=>{ if(x<cut) delete habits[x]; });
  LS.set('ppl-habits', habits);
}
function habitsHTML(){
  const t=todayHabits();
  let h='<section class="checkin"><h2>Today</h2><div class="chips"><span class="lbl">Protein meals (~35 g)</span>';
  for(let v=0; v<=4; v++) h+='<button type="button" data-act="hp" data-v="'+v+'" aria-pressed="'+(t.p===v)+'">'+v+'</button>';

function habitsText(){
  const days=[]; for(let i=0;i<7;i++) days.push(daysAgoISO(i));
  const rec=days.map(x=>habits[x]).filter(x=>x && Object.keys(x).length);
  if(!rec.length) return '';
  const ps=rec.filter(x=>x.p!=null).map(x=>x.p);
  const parts=[];
  if(ps.length) parts.push('protein meals avg '+(Math.round(ps.reduce((a,b)=>a+b,0)/ps.length*10)/10)+'/4');
  parts.push('creatine '+rec.filter(x=>x.cr).length+'/'+rec.length+' days');

function energyLinkText(){
  const g=sessions.filter(s=>s.day!=='cardio' && s.energy!=null);
  const withCi=g.filter(s=>s.sleep!=null || s.fedH || s.snack!=null);
  if(!withCi.length) return '';
  const avg=a=>Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10;
  const cmp=(label, inA, inB, la, lb)=>{
    const A=withCi.filter(inA).map(s=>s.energy), B=withCi.filter(inB).map(s=>s.energy);
    if(A.length<2 || B.length<2) return null;
    return label+': '+la+' '+avg(A)+' (n='+A.length+') vs '+lb+' '+avg(B)+' (n='+B.length+')';
  };
  const out=[
    cmp('Last meal', s=>longGap(s.fedH), s=>s.fedH && !longGap(s.fedH), '3h+', 'under 3h'),
    cmp('Sleep', s=>s.sleep!=null && s.sleep<6, s=>s.sleep!=null && s.sleep>=6, 'under 6h', '6h+'),
    cmp('Snack', s=>s.snack===true, s=>s.snack===false, 'yes', 'no')
  ].filter(Boolean);
  if(!out.length) return 'Energy vs check-in: '+withCi.length+' session'+(withCi.length===1?'':'s')+' so far — needs at least 2 in each group to compare.';
  return 'Energy on last sets (1–5) vs check-in — '+out.join(' · ');
}

/* ---------- deload ---------- */
function gymSessions(){ return sortedSessions().filter(s=>s.day!=='cardio' && (s.exercises||[]).length); }
function deloadActive(){ return !!(deload.activeUntil && deload.activeUntil>=todayISO()); }
function deloadStatus(){
  const g=gymSessions(); if(!g.length) return {due:false};
  // A logged deload, or any 7+ day gap between gym sessions (time off), resets the clock.
  let since = g[g.length-1].date;
  for(let i=0;i<g.length-1;i++){ if(daysBetween(g[i+1].date, g[i].date)>=7){ since=g[i].date; break; } }
  if(deload.lastAt && deload.lastAt>since) since=deload.lastAt;
  const weeks = Math.floor(daysBetween(since, todayISO())/7);
  const last3=g.slice(0,3);
  const en=last3.filter(s=>s.energy!=null).map(s=>s.energy);
  const rirs=[]; last3.forEach(s=>(s.exercises||[]).forEach(e=>{ if(e.rir!=null) rirs.push(e.rir); }));
  const avgE = en.length>=3 ? en.reduce((a,b)=>a+b,0)/en.length : null;
  const avgR = rirs.length>=4 ? rirs.reduce((a,b)=>a+b,0)/rirs.length : null;
  const reasons=[];
  if(weeks>=6) reasons.push(weeks+' weeks since the last easy week');
  if(weeks>=4 && avgE!=null && avgE<=2) reasons.push('energy averaged '+(Math.round(avgE*10)/10)+'/5 over the last 3 sessions');
  if(weeks>=4 && avgR!=null && avgR<=0.5) reasons.push('last sets are mostly going to failure');
  const snoozed = deload.snoozeUntil && deload.snoozeUntil>todayISO();
  return {due: reasons.length>0 && !snoozed && !deloadActive(), reasons, weeks, since};
}
const DELOAD_HOW='Same weights, about half the sets (2 per exercise), stop with 3+ reps in the tank. Keep cardio easy. Next week, go back to the normal plan.';
function deloadBanner(){
  if(deloadActive()) return '<div class="coachnote" style="border-left-color:var(--gold)"><b style="color:var(--gold)">Deload week · until '+esc(fmtDate(deload.activeUntil))+'</b>'+DELOAD_HOW+
    '<div style="margin-top:8px"><button type="button" class="btn" data-act="dl-end">End deload week</button></div></div>';
  const st=deloadStatus(); if(!st.due) return '';
  return '<div class="coachnote" style="border-left-color:var(--gold)"><b style="color:var(--gold)">Time for an easy week?</b>'+esc(st.reasons.join('; '))+'. '+DELOAD_HOW+
    '<div class="row2" style="margin-top:8px"><button type="button" class="btn primary" data-act="dl-start">Start deload week</button><button type="button" class="btn" data-act="dl-snooze">Not now</button></div></div>';
}
function deloadText(){
  if(deloadActive()) return 'Deload week in progress (until '+fmtDate(deload.activeUntil)+').';
  const st=deloadStatus(); if(!st.weeks && st.weeks!==0) return '';
  return 'Weeks since last deload: '+st.weeks+(st.due?' — deload suggested ('+st.reasons.join('; ')+')':'');
}

/* ---------- fat-loss pace and diet breaks ---------- */
function paceData(){
  const w=sessions.filter(s=>s.bw).map(s=>({d:s.date,v:Number(s.bw)})).sort((a,b)=>a.d.localeCompare(b.d));
  if(w.length<3) return {need:true, n:w.length};
  let pts=w.filter(x=>x.d>=daysAgoISO(28));
  if(pts.length<3 || daysBetween(pts[0].d, pts[pts.length-1].d)<10) pts=w.filter(x=>x.d>=daysAgoISO(56));
  if(pts.length<3 || daysBetween(pts[0].d, pts[pts.length-1].d)<10) return {need:true, n:pts.length};
  const xs=pts.map(p=>daysBetween(pts[0].d,p.d)), ys=pts.map(p=>p.v);
  const mx=xs.reduce((a,b)=>a+b,0)/xs.length, my=ys.reduce((a,b)=>a+b,0)/ys.length;
  let num=0,den=0; xs.forEach((x,i)=>{num+=(x-mx)*(ys[i]-my); den+=(x-mx)*(x-mx);});
  const perWeek = den ? num/den*7 : 0;
  const span=daysBetween(pts[0].d, pts[pts.length-1].d);
  return {perWeek, n:pts.length, span, latest:ys[ys.length-1]};
}
function dietState(){
  if(diet) return diet;
  const first=sessions.slice().sort((a,b)=>a.date.localeCompare(b.date))[0];
  return {phase:'diet', since: first?first.date:todayISO(), assumed:true};
}
function paceText(){
  const p=paceData();
  if(p.need) return 'Weight trend: needs 3+ weigh-ins over 10+ days (log body weight 2–3 times a week, same time of day).';
  const r=Math.round(p.perWeek*100)/100, st=dietState();
  let verdict;
  if(st.phase==='break') verdict = Math.abs(r)<=0.25 ? 'steady, as intended on a diet break' : (r<0?'still dropping — eat a little more on the break':'rising — normal water/glycogen at first');
  else if(r>-0.2) verdict='slower than the 0.4–0.6 kg/week target';
  else if(r>-0.4) verdict='a bit slower than the 0.4–0.6 kg/week target';
  else if(r<=-0.7) verdict='faster than target — muscle and energy are at risk, eat a little more';
  else verdict='on target (0.4–0.6 kg/week)';
  return 'Weight trend: '+(r>0?'+':'')+r+' kg/week over '+p.span+' days ('+p.n+' weigh-ins) — '+verdict+'.';
}
function dietText(){
  const st=dietState(), days=daysBetween(st.since, todayISO()), wk=Math.floor(days/7)+1;
  if(st.phase==='break'){
    return 'Diet break day '+(days+1)+' (since '+fmtDate(st.since)+'): eat at maintenance, keep training.'+(days>=14?' Two weeks done — time to go back to the diet.':(days>=7?' 1 week done — you can go back to the diet any time in the next week.':''));
  }
  return 'Diet week '+wk+' (since '+fmtDate(st.since)+(st.assumed?', your first logged session':'')+').'+(wk>=10?' A 1–2 week break at maintenance is overdue (every 6–10 weeks).':wk>=6?' A 1–2 week break at maintenance is due soon (every 6–10 weeks).':'');
}
function weekPanel(){

/* ---------- fitness meter (age norms, men 50-59) ---------- */
// Each test gives a score of 0-100, roughly the percentile among men 50-59.
// Sources: Cooper Institute VO2max table (men 50-59: 40th 35.6, 60th 39.2, 80th 43.4, 95th 48.9 mL/kg/min);
// Rockport walk formula (Kline 1987); grip centiles (Dodds 2014, UK, age 50); push-ups (ACSM 50-59 categories);
// single-leg stance (Springer 2007); sitting-rising test (Araujo 2012); Biering-Sorensen (mean 89 s, SD 55, men 50-54).
const normCdf = z => { const t=1/(1+0.2316419*Math.abs(z)), d=0.3989423*Math.exp(-z*z/2);
  const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return z>0?1-p:p; };
const clampP = p => Math.max(1, Math.min(99, Math.round(p)));
function interpP(x, pts){ // pts: [[value, percentile], ...] ascending
  if(x<=pts[0][0]) return pts[0][1]*Math.max(0,x)/pts[0][0];
  for(let i=1;i<pts.length;i++) if(x<=pts[i][0]){ const [x0,p0]=pts[i-1],[x1,p1]=pts[i]; return p0+(p1-p0)*(x-x0)/(x1-x0); }
  const [xa,pa]=pts[pts.length-2],[xb,pb]=pts[pts.length-1]; return Math.min(99, pb+(pb-pa)*(x-xb)/(xb-xa));
}
const VO2_PTS=[[29.3,5],[32.0,20],[35.6,40],[39.2,60],[43.4,80],[48.9,95]];
const GRIP_PTS=[[35,10],[41,25],[48,50],[54,75],[60,90]];
const PU_PTS=[[4,5],[8.5,10],[12.5,25],[17.5,50],[24.5,70],[30.5,90],[40,98]];
function parseClock(v){ const t=String(v||'').trim(); if(!t) return null; if(t.includes(':')){const [m,s]=t.split(':').map(Number); return isNaN(m)||isNaN(s)?null:m+s/60;} const n=Number(t.replace(',','.')); return isNaN(n)?null:n; }
const TESTS = {
  walk:{name:'1-mile walk (aerobic)', weight:35, every:70,
    fields:[['time','Time (mm:ss)','text','15:00'],['hr','Heart rate at finish','number','120'],['wt','Body weight kg','number','']],
    proto:'Flat 1 mile (1.6 km): a track, or a treadmill at 0% incline. Warm up 5 min. Walk as fast as you can without jogging. Read your heart rate the moment you finish (watch or chest strap). Formula: Rockport walk test (Kline 1987); error about ±4 mL/kg/min.',
    score(v){ const min=parseClock(v.time), hr=Number(v.hr), kgw=Number(v.wt)||bodyWeight(), age=profile.age||53;
      if(!min||!hr) return null;
      const lmin=6.9652+0.0091*(kgw*2.20462)-0.0257*age+0.5955-0.2240*min-0.0115*hr, vo2=lmin*1000/kgw;
      const p=interpP(vo2,VO2_PTS), err=Math.abs(interpP(vo2+4,VO2_PTS)-interpP(vo2-4,VO2_PTS))/2;
      return {s:clampP(p), err:Math.round(err), txt:'VO2max ≈ '+vo2.toFixed(1)+' mL/kg/min ('+v.time+', HR '+hr+')', approx:vo2<35.6, note:vo2<35.6?'below the 40th percentile the table is extrapolated':''}; }},
  grip:{name:'Grip strength', weight:20, every:28,
    fields:[['kg','Best squeeze, stronger hand (kg)','number','45']],
    proto:'Hand dynamometer. Stand, arm by your side, elbow slightly bent. Squeeze as hard as you can for 3 s. 2–3 tries per hand, 1 min apart. Enter the best on your stronger hand.',
    score(v){ const g=Number(v.kg); if(!g) return null; const adj=(profile.age||53)>=55?1:0;
      const p=interpP(g+adj,GRIP_PTS), rel=Math.round(g/bodyWeight()*1000)/10;
      return {s:clampP(p), err:Math.round(Math.abs(interpP(g+2,GRIP_PTS)-interpP(g-2,GRIP_PTS))/2), txt:g+' kg (UK norms, age 50: median 48 kg) · '+rel+'% of body weight (Korea 국민체력100 grade-3 floor: 50.1%)'}; }},
  pushups:{name:'Push-ups', weight:15, every:70,
    fields:[['reps','Push-ups in a row','number','15']],
    proto:'Full push-ups from the toes, chest down to about a fist above the floor, arms straight at the top, steady pace, no rest. Count until form breaks. Stop if your back goes above 3/10.',
    score(v){ const r=Number(v.reps); if(v.reps===''||v.reps==null||isNaN(r)) return null;
      const cat = r>=31?'excellent':r>=25?'good':r>=18?'above average':r>=13?'average':r>=9?'below average':'poor';
      return {s:clampP(interpP(r,PU_PTS)), err:10, txt:r+' reps — ACSM category for 50–59: '+cat, approx:true, note:'percentiles estimated from category bands'}; }},
  sls:{name:'Single-leg balance', weight:10, every:28,
    fields:[['open','Eyes open, s (max 45)','number','30'],['closed','Eyes closed, s (max 45)','number','8']],
    proto:'Barefoot, arms crossed on your chest, lift one foot without touching the standing leg. Time until the foot touches down, the arms move or you hop. Max 45 s. Best of 3, better leg. Do eyes-closed next to a wall.',
    score(v){ const o=v.open===''||v.open==null?null:Math.min(45,Number(v.open)), c=v.closed===''||v.closed==null?null:Math.min(45,Number(v.closed));
      if(o==null && c==null) return null;
      const po = o!=null ? normCdf((o-41.5)/10.5)*100 : null, pc = c!=null ? normCdf((c-8.6)/8.8)*100 : null;
      let p; if(po!=null && pc!=null) p = o>=45 ? pc : (po+pc)/2; else p = po!=null ? po : pc;
      const t=[]; if(o!=null) t.push('eyes open '+o+' s (50–59 average 41.5)'); if(c!=null) t.push('eyes closed '+c+' s (average 8.6)');
      return {s:clampP(p), err:12, txt:t.join(' · ')+(o!=null&&o<10?' — under 10 s: discuss with your doctor':''), approx:true, note:(o!=null&&o>=45&&c==null?'45 s is the ceiling: add eyes closed for a real score':'normal approximation')}; }},
  srt:{name:'Sitting-rising test', weight:10, every:70,
    fields:[['score','Score 0–10 (steps of 0.5)','number','8']],
    proto:'From standing, sit down on the floor cross-legged and stand back up. Start at 10; take off 1 for each hand, knee, forearm or side of the leg you use for support (going down and coming up), and 0.5 for a clear wobble. Best of 2 tries. Skip if your back is above 3/10.',
    score(v){ const s=Number(v.score); if(v.score===''||v.score==null||isNaN(s)) return null; const x=Math.max(0,Math.min(10,s));

const TEST_KEYS=Object.keys(TESTS);
function latestTest(k){ return tests.filter(t=>t.key===k).sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id))[0]||null; }
function scoreOf(t){ try{ return t ? TESTS[t.key].score(t.v) : null; }catch(e){ return null; } }
function meterData(){
  const cut=daysAgoISO(84), rows=[];
  TEST_KEYS.forEach(k=>{ const t=latestTest(k), sc=scoreOf(t); rows.push({k, t, sc, current: !!(t && sc && t.date>=cut)}); });
  const cur=rows.filter(r=>r.current);
  const ready = cur.some(r=>r.k==='walk') && cur.length>=4;
  let overall=null, err=null;
  if(cur.length){
    const W=cur.reduce((a,r)=>a+TESTS[r.k].weight,0);
    overall=Math.round(cur.reduce((a,r)=>a+r.sc.s*TESTS[r.k].weight,0)/W);
    err=Math.round(cur.reduce((a,r)=>a+r.sc.err*TESTS[r.k].weight,0)/W);
  }
  const weakest = cur.length ? cur.reduce((a,r)=>r.sc.s<a.sc.s?r:a) : null;
  return {rows, cur, ready, overall, err, weakest};
}
const band = s => s<20?'well below average':s<40?'below average':s<60?'around average':s<80?'above average':'well above average';
const barColor = s => s<25?'var(--bad)':s<45?'var(--warn)':'var(--ok)';
function fitnessText(){
  if(!tests.length) return '';

  if(m.ready) t+='Overall: '+m.overall+' ±'+m.err+' ('+band(m.overall)+') · weakest: '+TESTS[m.weakest.k].name+' '+m.weakest.sc.s+'\n';
  else t+='Overall: not shown yet — needs the walk test plus 3 other tests from the last 12 weeks ('+m.cur.length+' current'+(m.cur.some(r=>r.k==='walk')?'':', no walk test')+')\n';

}

function sessionBlock(s){
  const out=[];
  const dl=dayLabel(s).toUpperCase();
  out.push(dl+(/DAY$/.test(dl)?'':' DAY')+' — '+fmtDate(s.date)+(s.plan?' (plan '+s.plan+')':'')+(s.deload?' [DELOAD WEEK]':''));
  if(s.startedAt) out.push('Time: '+fmtTime(s.startedAt)+(s.endedAt?'–'+fmtTime(s.endedAt):'')+(s.durationMin!=null?' ('+s.durationMin+' min)':''));
  const ci=checkinText(s); if(ci) out.push('Check-in: '+ci);
  const kt=kcalText(s);
  (s.exercises||[]).forEach(e=>{
    const ex = (program[s.day]||[]).find(x=>x.id===e.id) || {sets:e.target?e.target.sets:0,reps:e.target?e.target.reps:0,assist:e.assist};
    const prev = lastEntryFor({id:e.id,name:e.name}, null);
    let prevTxt='';
    const before = sortedSessions().find(x=>x.id!==s.id && (x.date<s.date || (x.date===s.date && x.savedAt<s.savedAt)) && (x.exercises||[]).some(y=>y.id===e.id||y.name===e.name));
    if(before){
      const pe=before.exercises.find(y=>y.id===e.id||y.name===e.name);
      const a=topWeight(e.sets,e.assist), b=topWeight(pe.sets,e.assist);
      const exT = Object.assign({name:e.name}, ex);
      if((isTimed(exT)||isBodyOnly(exT)) && !a && !b){
        const best=xs=>{const r=xs.map(t=>Number(t.r)).filter(Boolean); return r.length?Math.max(...r):null;};
        const u=isTimed(exT)?' s':' reps', A=best(e.sets), B=best(pe.sets);
        if(A!=null&&B!=null) prevTxt=' | prev best '+B+u+(A!==B?' → '+A+u:' (same)');
      } else if(a!=null&&b!=null){const d=Math.round((a-b)*100)/100; prevTxt = e.assist ? (' | prev assist '+kg(b)+(d?(' → '+kg(a)+' ('+(d<0?kg(-d)+' kg less help':kg(d)+' kg more help')+')'):' (same)')) : (' | prev top '+kg(b)+(d?(' → '+(d>0?'+':'')+kg(d)+' kg'):' (same)'));}
    }
    const tgt = e.target ? e.target.sets+'x'+e.target.reps+(e.target.repsMax?'-'+e.target.repsMax:'') : '';
    out.push('- '+e.name+(e.assist?' [assist kg]':'')+' ('+tgt+'): '+setsText(e.sets, Object.assign({name:e.name}, ex))+(e.rir!=null?' | last set '+rirLabel(e.rir)+' in reserve':'')+prevTxt);
  });
  cardioLines(s).forEach(l=>out.push('Cardio — '+l));
  if(kt) out.push(kt);
  const extra=[s.energy?((s.day==='cardio'?'Energy ':'Energy on last sets ')+s.energy+'/5'):'', s.back!=null?('Lower back '+s.back+'/10'):'', s.bw?('Weight '+s.bw+' kg'):'', s.waist?('Waist '+s.waist+' cm'):''].filter(Boolean);
  if(extra.length) out.push(extra.join(' · '));
  if(s.notes) out.push('Notes: '+s.notes);
  return out.join('\n');
}
function buildReport(mode){
  const ss = sortedSessions();
  if(!ss.length) return 'No sessions saved yet. Log a workout on the Push, Pull or Legs tab and tap Save session.';
  if(mode==='last') return 'LIFT LOG — last session\n\n'+sessionBlock(ss[0])+foodLine(ss[0].date);
  if(mode==='week'){
    const c=daysAgoISO(6);
    const wk=ss.filter(s=>s.date>=c).reverse();
    if(!wk.length) return 'No sessions in the last 7 days.';
    const backs=wk.filter(s=>s.back!=null).map(s=>s.back);
    const walks=wk.reduce((a,s)=>a+cardioMinutes(s),0);
    const lbls=[...new Set(wk.map(dayLabel))];
    let t='LIFT LOG — last 7 days: '+wk.length+' sessions ('+lbls.map(l=>wk.filter(s=>dayLabel(s)===l).length+' '+l).join(', ')+')\n';
    t+='Cardio total: '+walks+' of '+(DAYS.cardio.goalMin||120)+' min goal'+(backs.length?' · Lower back range '+Math.min(...backs)+'–'+Math.max(...backs)+'/10':'')+'\n';
    [weekKcalText(), habitsText(), paceText(), dietText(), deloadText(), energyLinkText()].filter(Boolean).forEach(x=>t+=x+'\n');
    return t+'\n'+wk.map(sessionBlock).join('\n\n')+foodWeekText();
  }
  const rows=progressRows().filter(r=>r.pts.length);
  let t='LIFT LOG — progress since first logged session\n(score = average of all sets, weight and reps combined as estimated one-rep max; assisted moves use that day\'s body weight minus assist; carries = kg × steps)\n';
  ['push','pull','legs','cardio'].forEach(day=>{
    const rs=rows.filter(r=>r.day===day); if(!rs.length) return;
    t+='\n'+(day==='cardio'?'CARDIO-DAY ADD-ON':String(DAYS[day].label||day).toUpperCase())+'\n';
    rs.forEach(({ex,pts,kind})=>{const f=pts[0].w,n=pts[pts.length-1].w,d=Math.round((n-f)*100)/100;
      const u=KIND_UNIT[kind];
      t+='- '+ex.name+': '+kg(f)+' → '+kg(n)+u+' ('+(d>0?'+':'')+kg(d)+((kind==='kg'||kind==='carry')&&f?', '+(d>0?'+':'')+Math.round(d/f*100)+'%':'')+', '+pts.length+' sessions)\n';});
  });
  const bws=ss.filter(s=>s.bw).reverse(); if(bws.length) t+='\nBody weight: '+bws[0].bw+' kg ('+fmtDate(bws[0].date)+') → '+bws[bws.length-1].bw+' kg ('+fmtDate(bws[bws.length-1].date)+')';
  const ws=ss.filter(s=>s.waist).reverse(); if(ws.length) t+='\nWaist: '+ws[0].waist+' cm → '+ws[ws.length-1].waist+' cm';
  const pc=paceText(); if(pc) t+='\n'+pc;
  const ft=fitnessText(); if(ft) t+='\n\n'+ft;
  return t;
}

function beep(freq, ms, when){
  if(!soundOn || !actx) return;
  try{
    const t=actx.currentTime+(when||0), o=actx.createOscillator(), g=actx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.35,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+ms/1000);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+ms/1000+0.05);
  }catch(e){}
}
